<!DOCTYPE html>
<html xmlns:th="http://www/thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSS読込 -->
<link rel="stylesheet" th:href="@{/css/login.css}">
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<!-- JS読込 -->
<script th:src="@{/js/countryHandler.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<title th:text="#{login.title}"></title>
</head>
<body class="bg-light">
	<div class="text-center mt-5">
		<form method="post" th:action="@{/login}" class="form-login">
			<h2 th:text="#{login.title}"></h2>
			
			<!-- 電話番号 -->
			<div class="form-group">
				<div class="input-group">
					<select class="form-select" name="countryCode"  id="countryCode">
						<option th:each="country : ${countryList}"
								th:value="${country.countryCode}"
								th:text="${country.name + ' ' + country.countryCode}"
								th:data-placeholder="${country.phoneExample}"
								th:selected="${country.countryCode == '+86'}">
						</option>
					</select>
					
					<input type="tel"
						   class="form-control"
						   id="phoneNumber"
						   name="phoneNumber"
					>
				</div>
			</div>

			
			<!-- パスワード -->
			<div class="form-group mt-3">
				<input type="password" class="form-control" th:placeholder="#{password}" name="password">
			</div>
			<input type="submit" th:value="#{login.btn}" class="btn btn-primary mt-3"><br>
			<div class="mt-2">
				<a th:href="@{/user/signup}" th:text="#{link.signup}"></a>			
			</div>
		</form>
	</div>
</body>
</html>
