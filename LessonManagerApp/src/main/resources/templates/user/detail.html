<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
<title>ユーザー詳細画面</title>
</head>
<body>
	<div layout:fragment="content">
		
		<div class="header border-botom">
			<h1 class="h2">ユーザー詳細</h1>
		</div>
		
		<form id="admin-user-detail-form" method="post" th:action="@{/user/detail}" class="form-signup" th:object="${userDetailForm}">
			<input type="hidden" th:field="*{userId}">
			<!-- ユーザー詳細画面 -->
			<table class="table table-bordered table-hover">
				<tbody>
					<tr>
						<th class="w-25">ユーザーID</th>
						<td th:text="*{userId}"></td>
					</tr>
					<tr>
					<th>電話番号</th>
						<td th:text="*{e164PhoneNumber}"></td>
					</tr>
					<tr>
						<th>ユーザー名</th>
						<td>
							<input type="text" class="form-control" th:field="*{userName}">
						</td>
					</tr>
					<tr>
						<th>パスワード</th>
						<td>
							<input type="text" class="form-control" th:field="*{password}">
						</td>
					<tr>
						<th>目標レベル</th>
						<td>
							<input type="text" class="form-control" th:field="*{goalLevelId}">
						</td>
					</tr>
					<tr>
						<th>アカウント作成日</th>
						<td th:text="*{createdAt}"></td>
					</tr>
					<tr>
						<th>アカウント最終更新日</th>
						<td th:text="*{updatedAt}"></td>
					</tr>
				</tbody>
			</table>
			
			<!-- ボタンエリア -->
			<div class="text-center">
				
				<!-- 削除ボタン -->
				<button class="btn btn-danger" type="submit" name="delete">
					削除
				</button>
				
				<!-- 更新ボタン -->
				<button class="btn btn-primary" type="submit" name="update">
					更新
				</button>
				
			</div>
			
		</form>
		
		<section class="mt-4">
			<div class="header border-bottom mb-3">
				<h1 class="h2">予約一覧</h1>
			</div>
			
			<p th:if="${#lists.isEmpty(reservationList)}">
				予約はありません
			</p>
			
			<div class="table-responsive" th:unless="${#lists.isEmpty(reservationList)}">
				
				<table class="table table-striped table-bordered">
					<thead>
						<tr>
							<th>予約ID</th>
							<th>開始時間</th>
							<th>終了日時</th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="reservation : ${reservationList}">
							<td th:text="${reservation.reservationId}"></td>
							
							<td th:text="${#temporals.format(
								reservation.startsAt, 'yyyy/MM/dd HH:mm')}">
							</td>
							
							<td th:text="${#temporals.format(
								reservation.endsAt, 'yyyy/MM/dd HH:mm')}">
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>
	</div>
</body>
</html>
