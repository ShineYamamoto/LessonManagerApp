<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
<title>アカウント情報</title>
<link rel="stylesheet" th:href="@{/css/user-profile.css}">
</head>
<body>
	<main layout:fragment="content" class="profile-page">
		
		<header class="profile-heading">
			<h1>アカウント情報</h1>
			<p>登録されている情報を確認・変更できます</p>
		</header>
		
		<p class="profile-notice" role="status" th:if="${successMessage}" th:text="${successMessage}">変更を保存しました。</p>
		
		<section class="profile-card" aria-label="登録情報" th:object="${userDetailDto}">
			<!-- ユーザー詳細画面 -->
			<div class="profile-row">
				<div class="profile-field">
					<span class="profile-label">ユーザー名</span>
					<span class="profile-value" th:text="*{userName}">名前</span>
				</div>
				<a class="profile-button" th:href="@{/user/edit/name}">編集する</a>
			</div>
			
			<div class="profile-row">
				<div class="profile-field">
					<span class="profile-label">電話番号</span>
					<span class="profile-value" th:text="*{e164PhoneNumber}">電話番号</span>
				</div>
				<button type="button" class="profile-button profile-button-disabled" disabled title="今後実装する予定です">編集する</button>
			</div>
			
			<div class="profile-row">
				<div class="profile-field">
					<span class="profile-label">パスワード</span>
					<span class="profile-value" aria-label="パスワードは非表示です">••••••••</span>
				</div>
				<button type="button" class="profile-button profile-button-disabled" disabled title="今後実装する予定です">編集する</button>
			</div>
			
			<div class="profile-row">
				<div class="profile-field">
					<span class="profile-label">目標レベル</span>
					<span class="profile-value" th:text="*{goalLevelCode != null ? goalLevelCode : '未設定'}">目標レベル</span>
				</div>
				<button type="button" class="profile-button profile-button-disabled" disabled title="今後実装する予定です">編集する</button>
			</div>
			
			<div class="profile-row">
				<div class="profile-field">
					<span class="profile-label">表示タイムゾーン</span>
					<span class="profile-value" th:text="*{displayTimeZone != null ? displayTimeZone : '未設定'}">タイムゾーン</span>
				</div>
				<button type="button" class="profile-button profile-button-disabled" disabled title="今後実装する予定です">編集する</button>
			</div>		
		</section>
		<p class="profile-footnote">現在編集できる項目はユーザー名のみです。その他の項目は順次対応します。</p>
	</main>
</body>
</html>
