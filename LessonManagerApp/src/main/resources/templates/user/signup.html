<!DOCTYPE html>
<html xmlns:th="http://www/thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSS読込 -->
<link rel="stylesheet" th:href="@{/css/signup.css}">
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<!-- JS読込 -->
<script th:src="@{/js/countryHandler.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<title>ユーザー登録</title>
</head>
<body class="bg-light">
	<form id="signup-form" method="post" action="/user/signup" class="form-signup mt-5">
		<h2 class="text-center">ユーザー登録</h2>
		
		<!-- 電話番号 -->
		<div class="form-group">
			<label for="countryCode">電話番号</label>
			<div class="input-group">
				<select class="form-select" name="countryCode"  id="countryCode">
					<option th:each="country : ${countryList}"
							th:value="${country.countryCode}"
							th:text="${country.name + ' ' + country.countryCode}"
							th:data-placeholder="${country.phoneExample}"
							th:selected="${country.countryCode == '+86'}">
					</option>
				</select>

				<input type="tel"
					   class="form-control"
					   id="phoneNumber"
					   name="phoneNumber"
				>
			</div>
		</div>
		
		<!-- パスワード -->
		<div class="form-group">
			<label for="password">パスワード</label>
			<input type="text" id="password" class="form-control">
		</div>
		
		<!-- ユーザー名 -->
		<div class="form-group">
			<label for="userName">ユーザー名</label>
			<input type="text" id="userName" class="form-control">
		</div>
		
		<!-- 目標レベル -->
		<div class="form-group">
			<label for="goal">目標レベル</label>
			<select class="form-select" name="goal" id="goal">
				<option>N1</option>
				<option>N2</option>
				<option>N3</option>
			</select>
		</div>
		
		<!-- 登録ボタン -->
		<input type="submit" value="ユーザー登録" class="btn btn-primary w-100 mt-4">
		<div class="text-center mt-2">
			<a th:href="@{/login}">ログインはこちら</a>
		</div>
	</form>

</body>
</html>
