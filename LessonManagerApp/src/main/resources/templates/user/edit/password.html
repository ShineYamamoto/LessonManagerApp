<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{user.password.edit.title}">パスワードの編集</title>
<link rel="stylesheet" th:href="@{/css/user-profile.css}">
</head>
<body>
	<main layout:fragment="content" class="profile-page">
		<header class="profile-heading">
			<h1 th:text="#{user.password.edit.title}">パスワード</h1>
			<p th:text="#{user.password.edit.notice}"></p>
		</header>
		
		<section class="profile-card profile-edit-card">
			
			<form method="post" th:action="@{/user/edit/password}" th:object="${userPasswordEditForm}">
				
				<!-- 現在のパスワード -->
				<div class="profile-input-group">
					
					<label for="currentPassword" th:text="#{user.password.edit.current}"></label>
					<input type="password"
						   id="currentPassword"
						   name="currentPassword"
						   autocomplete="current-password"
						   minlength="4"
						   maxlength="100"
						   required
						   th:attr="aria-invalid=${#fields.hasErrors('currentPassword')}">
						   
					<p class="profile-error" role="alert" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
					
				</div>
				
				<!-- 新しいパスワード -->
				<div class="profile-input-group">
					
					<label for="newPassword" th:text="#{user.password.edit.new}"></label>
					<input type="password"
						   id="newPassword"
						   name="newPassword"
						   autocomplete="new-password"
						   minlength="4"
						   maxlength="100"
						   required
						   aria-describedby="passwordHelp"
						   th:attr="aria-invalid=${#fields.hasErrors('newPassword')}">
						   
					<small id="passwordHelp" th:text="#{user.password.edit.help}"></small>
						   
					<p class="profile-error" role="alert" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
					
				</div>
				
				<!-- 新しいパスワード（確認用） -->
				<div class="profile-input-group">
					
					<label for="confirmPassword" th:text="#{user.password.edit.confirm}"></label>
					<input type="password"
						   id="confirmPassword"
						   name="confirmPassword"
						   autocomplete="new-password"
						   minlength="4"
						   maxlength="100"
						   required
						   th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}">
						   
					<p class="profile-error" role="alert" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
				</div>
				
				<!-- ボタン -->
				<div class="profile-actions">
					
					<button type="submit" class="profile-button profile-button-primary" th:text="#{user.edit.submit}">保存する</button>
					<a class="profile-button profile-button-outline" th:href="@{/user/detail}" th:text="#{user.edit.cancel}">キャンセル</a>
					
				</div>
			</form>
		</section>
	</main>
</body>
</html>
