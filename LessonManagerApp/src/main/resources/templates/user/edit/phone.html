<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{user.phone.edit.title}">電話番号の変更</title>
<link rel="stylesheet" th:href="@{/css/user-profile.css}">
<script th:src="@{/js/countryHandler.js}" defer></script>
</head>
<body>
	<main layout:fragment="content" class="profile-page">
		<header class="profile-heading">
			<h1 class="profile-heading" th:text="#{user.phone.edit.title}">電話番号の変更</h1>
		</header>
		
		<section class="card border-0 shadow-sm mt-4" style="max-width: 640px;">
			
			<div class="card-body p-4">
				
				<!-- 現在の電話番号 -->
				<div class="mb-4">
					<label class="form-label" th:text="#{user.phone.edit.current}"></label>
					<p class="fw-semibold fs-5" th:text="${currentPhoneNumber}"></p>
				</div>
				
				<form method="post" th:action="@{/user/edit/phone}" th:object="${userPhoneEditForm}">
					
					<!-- 新しい電話番号 -->
					<div class="mb-4">
						
						<label class="form-label" for="phoneNumber" th:text="#{user.phone.edit.new}"></label>
						
						<edit class="input-group">
							<select class="form-select" th:field="*{regionCode}" th:errorclass="is-invalid" aria-label="国・地域">
								<option th:each="country : ${countryList}"
										th:value="${country.regionCode}"
										th:text="${country.name + ' ' + country.countryCode}"
										th:data-placeholder="${country.phoneExample}">
								</option>
							</select>
							<input type="tel"
								   class="form-control"
								   th:field="*{phoneNumber}"
								   th:errorclass="is-invalid"
								   autocomplete="tel-national"
								   maxlength="40"
								   required>
						</edit>
						
						<div class="text-danger small" th:errors="*{regionCode}"></div>
						<div class="text-danger small" th:errors="*{phoneNumber}"></div>
					</div>
					
					<!-- 現在のパスワード -->
					<div class="mb-4">
						
						<label class="form-label" for="currentPassword" th:text="#{user.phone.edit.password}"></label>
						
						<input type="password"
							   class="form-control"
							   id="currentPassword"
							   name="currentPassword"
							   autocomplete="current-password"
							   maxlength="100"
							   required>
						</input>
						
						<div class="text-danger small" th:errors="*{currentPassword}"></div>
					</div>
					
					<!-- 注意事項 -->
					<div class="alert alert-light border small" th:text="#{user.phone.edit.notice}"></div>
					
					<!-- ボタン -->
					<div class="d-flex justify-content-end gap-2">
						
						<a class="btn btn-outline-secondary" th:href="@{/user/detail}" th:text="#{user.phone.edit.cancel}">
							キャンセル
						</a>
						
						<button type="submit" class="btn btn-primary" th:text="#{user.phone.edit.submit}">
							変更する
						</button>
					</div>
				</form>
			</div>
		</section>
	</main>
</body>
</html>
