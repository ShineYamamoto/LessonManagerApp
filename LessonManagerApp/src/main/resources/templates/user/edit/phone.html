<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
<meta charset="UTF-8">
<title th:text="#{user.phone.edit.title}">電話番号の変更</title>
<link rel="stylesheet" th:href="@{/css/user-profile.css}">
<script th:src="@{/js/countryHandler.js}" defer></script>
</head>
<body>
	<main layout:fragment="content" class="profile-page">
		
		<header class="profile-heading">
			<h1 th:text="#{user.phone.edit.title}">電話番号の変更</h1>
			<p th:text="#{user.phone.edit.notice}"></p>
		</header>
		
		<section class="profile-card profile-edit-card">
			
			<div class="card-body p-4">
				
				<!-- 現在の電話番号 -->
				<div class="profile-current-phone">
					<span class="profile-label" th:text="#{user.phone.edit.current}"></span>
					<span class="profile-value" th:text="${currentPhoneNumber}"></span>
				</div>
				
				<form method="post" th:action="@{/user/edit/phone}" th:object="${userPhoneEditForm}">
					
					<!-- 新しい電話番号 -->
					<div class="profile-input-group">
						
						<label for="phoneNumber" th:text="#{user.phone.edit.new}"></label>
						
						<div class="profile-phone-fields">
							<!-- 国・地域 -->
							<select th:field="*{regionCode}" aria-label="国・地域" th:attr="aria-invalid=${#fields.hasErrors('regionCode')}">
								<option th:each="country : ${countryList}"
										th:value="${country.regionCode}"
										th:text="${country.name + ' ' + country.countryCode}"
										th:data-placeholder="${country.phoneExample}">
								</option>
							</select>
							<!-- 電話番号 -->
							<input type="tel"
								   th:field="*{phoneNumber}"
								   autocomplete="tel-national"
								   maxlength="40"
								   required
								   th:attr="aria-invalid=${#fields.hasErrors('phoneNumber')}">
						</div>
						
						<!-- 入力エラー -->
						<p class="profile-error" role="alert" th:if="${#fields.hasErrors('regionCode')}" th:errors="*{regionCode}"></p>
						<p class="profile-error" role="alert" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
					</div>
					
					<!-- 現在のパスワード -->
					<div class="profile-input-group">
						
						<label for="currentPassword" th:text="#{user.phone.edit.password}"></label>
						
						<input type="password"
							   id="currentPassword"
							   name="currentPassword"
							   autocomplete="current-password"
							   maxlength="100"
							   required
							   th:attr="aria-invalid=${#fields.hasErrors('currentPassword')}">
						</input>
						
						<p class="profile=error" role="alert" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
					</div>
					
					<!-- ボタン -->
					<div class="profile-actions">
						
						<button type="submit" class="profile-button profile-button-primary" th:text="#{user.edit.submit}">
							変更する
						</button>
						
						<a class="profile-button profile-button-outline" th:href="@{/user/detail}" th:text="#{user.phone.edit.cancel}">
							キャンセル
						</a>
					</div>
				</form>
			</div>
		</section>
	</main>
</body>
</html>
