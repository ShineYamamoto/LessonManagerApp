<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
	<!-- 個別CSS読込 -->
	<link rel="stylesheet" th:href="@{/css/userList.css}">
	<title>ユーザー一覧</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="header border-bottom">
			<h1 class="h2">ユーザー一覧画面</h1>
		</div>
		
		<!-- 検索 -->
		<div class="mb-4">
			<form id="user-search-form" method="get" th:action="@{/admin/user/list}" class="row" th:object="${AdminUserListForm}">
				<div class="col-sm">
					<input type="text" class="form-control" placeholder="ユーザー名" th:field="*{userName}">
				</div>
				<div class="col-sm">
					<input type="number" class="form-contro;" placeholder="目標レベル" th:field="*{goalLevelId}">
				</div>
				<div class="col-sm">
					<button class="btn btn-primary" type="submit">
						検索
					</button>
				</div>
			</form>
		</div>
		
		<div>
			<table class="table table-striped table-bordered table-hover">
				<head>
					<tr class="table-primary">
						<th class="th-width">電話番号</th>
						<th class="th-width">ユーザー名</th>
						<th class="th-width">目標レベル</th>
						<th class="th-width"></th>
					</tr>
				</head>
				<tbody>
					<tr th:each="user: ${userList}">
						<td th:text="${user.e164PhoneNumber}"></td>
						<td th:text="${user.userName}"></td>
						<td th:text="${user.goalLevelId}"></td>
						<td>
							<a class="btn btn-primary" th:href="@{'/admin/user/detail/' + ${user.userId}}">
								詳細
							</a>
						</td>
					</tr>
				</tbody>
			</table> 
		</div>
	</div>
</body>
</html>
