<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
	<!-- 個別CSS読込 -->
	<link rel="stylesheet" th:href="@{/css/userList.css}">
	<title>ユーザー一覧</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="header border-bottom">
			<h1 class="h2">ユーザー一覧画面</h1>
		</div>
		
		<!-- 検索 -->
		<div class="mb-4">
			<form id="user-search-form" method="get" th:action="@{/admin/user/list}" class="row" th:object="${adminUserListForm}">
				<div class="col-sm">
					<input type="text" class="form-control" placeholder="ユーザー名" th:field="*{userName}">
				</div>
				<div class="col-sm">
					<input type="number" class="form-control" placeholder="目標レベル" th:field="*{goalLevelId}">
				</div>
				<div class="col-sm">
					<button class="btn btn-primary" type="submit">
						検索
					</button>
				</div>
			</form>
		</div>
		
		<div>
			<table class="table table-striped table-bordered table-hover">
				<thead>
					<tr class="table-primary">
						<th class="th-width">電話番号</th>
						<th class="th-width">ユーザー名</th>
						<th class="th-width">目標レベル</th>
						<th class="th-width"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="user: ${userList}">
						<td th:text="${user.e164PhoneNumber}"></td>
						<td th:text="${user.userName}"></td>
						<td>
							<span th:if="${user.goalLevel != null}" th:text="${user.goalLevel.levelCode}"></span>
						</td>
						<td>
							<a class="btn btn-primary" th:href="@{'/admin/user/detail/' + ${user.userId}}">
								詳細
							</a>
						</td>
					</tr>
				</tbody>
			</table> 
		</div>
		
		<!-- ページネーション -->
		<nav aria-label="Page navigation">
			<th:block th:if="${page.totalPages > 1}">
				<ul class="pagination justify-content-center">
					<!-- 前へ -->
					<li class="page-item" th:classappend="${page.first ? 'disabled': ''}">
						<span th:if="${page.first}" class="page-link">前へ</span>
						<a th:if="${!page.first}" th:href="@{/admin/user/list(page = ${page.number} - 1)}" class="page-link" aria-label="Previous">
							前へ
						</a>
					</li>
					<!-- ページ番号 -->
					<th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
						<li class="page-item" th:classappend="${i == page.number ? 'active': ''}">
							<span th:if="${i} == ${page.number}" th:text="${i + 1}" class="page-link"></span>
							<a th:if="${i} != ${page.number}" th:href="@{/admin/user/list(page = ${i})}" class="page-link">
								<span th:text="${i+1}">ページ番号</span>
							</a>
						</li>
					</th:block>
					<!-- 次へ -->
					<li class="page-item" th:classappend="${page.last ? 'disabled': ''}">
						<span th:if="${page.last}" class="page-link">次へ</span>
						<a th:if="${!page.last}" th:href="@{/admin/user/list(page = ${page.number} + 1)}" class="page-link" aria-label="Next">
							<span aria-hidden="true">次へ</span>
						</a>
					</li>
				</ul>
			</th:block>

		</nav>
		
	</div>
</body>
</html>
