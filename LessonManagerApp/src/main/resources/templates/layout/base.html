<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<!-- 共通CSS読込 -->
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/base.css}">
<!-- 共通JS読込 -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}" defer></script>
<title>予約管理アプリ</title>
</head>
<body>
	<!-- 共通ヘッダー -->
	<nav layout:replace="~{layout/header::header-contents}"></nav>
	
	<div class="app-shell">
		<!-- スマホでメニュー外を押すと閉じるための背景 -->
		<div id="sidebar-backdrop" class="app-sidebar-backdrop" hidden></div>
		
		<!-- 共通メニュー -->
		<aside id="app-sidebar" class="sidebar app-sidebar" aria-label="サイドメニュー">
			<nav aria-label="メインナビゲーション" layout:insert="~{layout/menu::menu-contents}"></nav>
		</aside>
		
		<!-- 各ページのコンテンツ -->
		<div class="main app-main" id="app-main">
			<div layout:fragment="content"></div>
		</div>
	</div>
	
	<!-- サイドバー開閉制御 -->
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const toggleButton = document.getElementById('sidebar-toggle');
			const sidebar = document.getElementById('app-sidebar');
			const backdrop = document.getElementById('sidebar-backdrop');
			
			if (!toggleButton || !sidebar || !backdrop) return;
			
			const mobileQuery = window.matchMedia('(max-width: 767.98px)');
			
			function isOpen() {
				return mobileQuery.matches
						? document.body.classList.contains('sidebar-expanded')
						: !document.body.classList.contains('sidebar-collapsed');
			}
			
			function syncSidebar() {
				const open = isOpen();
				const mobile = mobileQuery.matches;
				
				toggleButton.setAttribute('aria-expanded', String(open));
				toggleButton.setAttribute('aria-label', open ? 'メニューを閉じる' : 'メニューを開く');
				sidebar.setAttribute('aria-hidden', String(!open));
				sidebar.inert = !open;
				backdrop.hidden = !(mobile && open);
				document.body.classList.toggle('app-menu-locked', mobile && open);
			}
			
			function setSidebarOpen(open) {
				document.body.classList.toggle('sidebar-expanded', mobileQuery.matches && open);
				document.body.classList.toggle('sidebar-collapsed', !mobileQuery.matches && !open);
				syncSidebar();
			}
			
			toggleButton.addEventListener('click', () => {
				const opening = !isOpen();
				setSidebarOpen(opening);
				if (opening && mobileQuery.matches) {
					sidebar.querySelector('a')?.focus();
				}
			});
			
			backdrop.addEventListener('click', () => {
				setSidebarOpen(false);
				toggleButton.focus();
			});
			
			document.addEventListener('keydown', event => {
				if (event.key === 'Escape' && mobileQuery.matches && isOpen()) {
					setSidebarOpen(false);
					toggleButton.focus();
				}
			});
			
			sidebar.addEventListener('click', event => {
				if (mobileQuery.matches && event.target.closest('a')) {
					setSidebarOpen(false);
				}
			});
			
			// 画面サイズを変更したときは各幅の初期状態に戻す
			mobileQuery.addEventListener('change', () => {
				document.body.classList.remove('sidebar-expanded', 'sidebar-collapsed');
				syncSidebar();
			});
			
			// 現在のURLと一致するリンクを強調する
			const normalizedPath = path => path.replace(/\/+$/, '') || '/';
			const currentPath = normalizedPath(window.location.pathname);
			const matchingLinks = Array.from(sidebar.querySelectorAll('.app-menu-link[href]'))
					.filter(link => {
						const linkPath = normalizedPath(new URL(link.href, window.location.href).pathname)
						return currentPath === linkPath || currentPath.startsWith(linkPath + '/');
					});
					
			matchingLinks.sort((left, right) => new URL(right.href).pathname.length - new URL(left.href).pathname.length);
			const activeLink = matchingLinks[0];
			if (activeLink) {
				activeLink.classList.add('is-active');
				activeLink.setAttribute('aria-current', 'page');
			}
			
			syncSidebar();
		});
	</script>
</body>
</html>
