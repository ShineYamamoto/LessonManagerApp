# ========================
# バリデーションエラーメッセージ
# ========================

NotBlank={0}は入力必須です
Length={0}は{2}桁以上{1}桁以下で入力してください
Pattern={0}は半角英数字や!、@、#などの半角記号で入力してください
NotNull={0}は入力必須です
GoalCheck={0}は選択肢にあるもののみ選択してください